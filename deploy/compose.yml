# Producción: un VPS con Docker Compose (ver docs/produccion.md). No se usa a
# mano: lo maneja deploy/server.sh, que fija CITARA_TAG y el archivo de secretos.
name: citara

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

# Lo que necesitan la API y el worker. Sin la conexión admin: esa solo la ve la CLI.
x-app-env: &app-env
  NODE_ENV: production
  TZ: UTC
  DATABASE_URL: postgres://citara_app:${APP_DB_PASSWORD:?falta APP_DB_PASSWORD}@postgres:5432/citara
  REDIS_URL: redis://redis:6379
  DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?falta DB_ENCRYPTION_KEY}
  PUBLIC_BASE_URL: https://${DOMAIN:?falta DOMAIN}
  META_APP_SECRET: ${META_APP_SECRET:?falta META_APP_SECRET}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?falta META_VERIFY_TOKEN}
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
  META_APP_ID: ${META_APP_ID:-}
  META_ES_CONFIG_ID: ${META_ES_CONFIG_ID:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: citara
      TZ: UTC
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # Por TCP a propósito: al inicializar la base, la imagen levanta un servidor
      # temporal solo por socket y luego lo reinicia. Por socket, pg_isready daría
      # "listo" en esa ventana y el primer respaldo caería en el reinicio.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d citara]
      interval: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: los jobs de BullMQ sobreviven a un reinicio. noeviction: BullMQ lo exige;
    # con memoria llena, Redis rechaza escrituras en vez de borrar jobs en silencio.
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
    logging: *logging

  api:
    image: citara:${CITARA_TAG:?falta CITARA_TAG}
    restart: unless-stopped
    command: [node, apps/api/dist/src/main.js]
    environment:
      <<: *app-env
      PORT: "3000"
      # Un salto: Caddy. Así el límite de intentos del panel ve la IP del cliente.
      TRUST_PROXY: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    logging: *logging

  worker:
    image: citara:${CITARA_TAG:?falta CITARA_TAG}
    restart: unless-stopped
    command: [node, apps/worker/dist/src/main.js]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # El worker cierra limpio con SIGTERM: termina los jobs en curso antes de salir.
    stop_grace_period: 30s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging: *logging

  # La CLI de siempre (tenant, operator, migrate…) en un contenedor de un solo
  # uso: `./deploy/citara <comando>`. Es lo único con la conexión admin.
  cli:
    image: citara:${CITARA_TAG:?falta CITARA_TAG}
    profiles: [cli]
    environment:
      <<: *app-env
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/citara
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?falta APP_DB_PASSWORD}
      BENCH_RESULTS_DIR: /app/bench-results
    volumes:
      - ../clientes:/app/clientes:ro
      - ../bench-results:/app/bench-results
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
